name: Pic4Pick
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Pic4Pick:
    type: application
    platform: iOS
    sources:
      - path: Sources/Pic4Pick
        excludes:
          - "Admin*.swift"
          - Resources
      - path: Sources/Pic4Pick/Resources
        buildPhase: resources
        excludes:
          - AdminMapPresets.json
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: .store-generated/Assets.xcassets
        buildPhase: resources
    preBuildScripts:
      - name: Check client configuration environment
        inputFiles:
          - $(SRCROOT)/scripts/check-client-config.py
          - $(SRCROOT)/Sources/Pic4Pick/Resources/ClientConfig.json
          - $(SRCROOT)/Sources/Pic4Pick/Resources/PublicMapConfig.json
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -eu
          expected=staging
          if [ "$CONFIGURATION" = Release ]; then expected=production; fi
          python3 "$SCRIPT_INPUT_FILE_0" "$expected" "$(dirname "$SCRIPT_INPUT_FILE_1")"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rlzhao.pic4pick
        INFOPLIST_FILE: .store-generated/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  Pic4PickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests/Unit]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pic4Pick
  Pic4PickUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeTests/UI]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pic4Pick
schemes:
  Pic4Pick:
    build:
      targets:
        Pic4Pick: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [Pic4Pick]
      targets: [Pic4PickTests, Pic4PickUITests]
    archive:
      config: Release
