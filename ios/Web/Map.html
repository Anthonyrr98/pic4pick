<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__MAP_SCRIPT_HASH__' 'wasm-unsafe-eval' https://webapi.amap.com; style-src 'unsafe-inline' https://webapi.amap.com; connect-src https://*.amap.com https://*.autonavi.com; img-src https: data: blob:; worker-src blob:; frame-src 'none'; base-uri 'none'; form-action 'none'">
<style>__MAP_CSS__
html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#e4eaef;font-family:system-ui}
.discovery-map #map{translate:0 var(--panel-map-offset,0px)}
.marker{width:44px;height:44px;background:transparent;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.marker span{display:block;width:9px;height:9px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #0005,0 6px 12px #0004}
.marker.compact{width:26px;height:26px;touch-action:manipulation}
.marker.compact span{box-sizing:border-box;width:6.5px;height:6.5px;border:0.8px solid white;box-shadow:0 0 0 0.5px #26323838}
.marker.compact:has(img){width:44px;height:44px}
.marker.photo-marker img{display:block;width:26px;height:26px;object-fit:cover;border:2px solid white;border-radius:50%;box-shadow:0 1px 4px #0003}
.photo-detail-map #map{background:#f4f4f1}
.photo-detail-map .maplibregl-canvas{filter:saturate(0.15);opacity:0.76}
.photo-detail-map .photo-marker img{width:30px;height:30px}
.discovery-map .maplibregl-ctrl-top-right{display:none}
.discovery-map :is(.amap-logo,.amap-copyright,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right){top:var(--attribution-top,0px)!important;bottom:auto!important;translate:0 calc(0px - var(--panel-map-offset,0px))}
.maplibregl-ctrl-attrib{font-size:10px!important}
</style></head><body><div id="map"></div><script>__MAP_JS__</script></body></html>
