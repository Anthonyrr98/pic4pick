name: Supabase Keepalive

on:
  schedule:
    # Run three times per day. GitHub Actions cron uses UTC.
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          query_table() {
            table="$1"
            fields="$2"

            curl --fail-with-body --show-error --silent --get \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 60 \
              "${SUPABASE_URL%/}/rest/v1/${table}" \
              --data-urlencode "select=${fields}" \
              --data-urlencode "limit=1" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "Accept: application/json" \
              --header "Accept-Profile: public" \
              --header "Cache-Control: no-cache" \
              --output "/tmp/supabase-keepalive-${table}.json"

            echo "Supabase query succeeded: ${table}"
          }

          query_table photos id
          query_table brand_settings id
          query_table gear_presets type

          echo "Supabase keepalive succeeded."
