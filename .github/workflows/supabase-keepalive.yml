name: Supabase Keepalive

on:
  schedule:
    # Run every 3 days at 10:20 China Standard Time.
    - cron: '20 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          curl --fail --show-error --silent --get "${SUPABASE_URL%/}/rest/v1/photos" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "Accept: application/json" \
            --header "Accept-Profile: public" \
            --output /tmp/supabase-keepalive.json

          echo "Supabase keepalive succeeded."
