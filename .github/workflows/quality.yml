name: Project checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build validation uses an absolute HTTPS URL without contacting a backend.
      VITE_API_BASE_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            miniapp/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix miniapp ci
      - run: npm run check
      - run: npm --prefix miniapp run build:weapp
